name: Build & Deploy to GitHub Pages

# DEAKTIVIERT: Hosting läuft seit Netlify-Umzug über Netlify (echte 301 via _redirects).
# Auto-Deploy nach GitHub Pages abgeschaltet, nur noch manuell auslösbar.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Eleventy
        run: npm run build
        # GitHub Pages liegt im Projekt-Unterpfad /Lingener-Baumaschinen/ -> Prefix nötig.
        # Gilt NUR für diesen CI-Build; lokal und Netlify bauen ohne Prefix (apex, Root).
        env:
          ELEVENTY_PATH_PREFIX: /Lingener-Baumaschinen/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
