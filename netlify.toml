# Netlify-Build für die LIBA-Website (Eleventy)
# Domain liegt im Root (apex) -> KEIN ELEVENTY_PATH_PREFIX setzen,
# damit .eleventy.js den Default pathPrefix "/" nutzt.
# Echte 301-Weiterleitungen kommen aus der generierten _site/_redirects
# (siehe src/_redirects.njk + src/_data/redirects.js).

[build]
  command = "npm run build"
  publish = "_site"
  # Build überspringen, wenn ein Push AUSSCHLIESSLICH Markdown-Dateien geändert hat
  # (Checklisten, README, QA-Berichte). Spart Build-Minuten auf dem Free-Tier.
  # ⚠️ Netlify-Konvention ist invertiert: Exit 0 = Build ÜBERSPRINGEN, Exit ≠ 0 = bauen.
  # Sicher, weil .eleventy.js templateFormats auf ["njk"] beschränkt — keine .md-Datei
  # kann den Output beeinflussen. Gegen vier echte Commits verifiziert (2026-07-27).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md'"

[build.environment]
  NODE_VERSION = "24"

# Sicherheits-Header (MA-3). CSP erlaubt self + die tatsächlich genutzten Dritt-Origins
# (Stripe; Google Analytics/Tag Manager, sobald echte GA4-ID gesetzt ist).
# script-src OHNE 'unsafe-inline': alle Seiten-Skripte sind ausgelagert
# (main.js, ga4-init.js). style-src behält 'unsafe-inline' für style=-Attribute
# (Hero-Hintergründe, Layout-Feinheiten) — für style-Attribute ist das risikoarm.
# connect-src enthält neben www.google-analytics.com auch *.google-analytics.com und
# *.analytics.google.com: GA4 sendet Messwerte an regionale Endpunkte (region1.…),
# die sonst geblockt würden und einzelne Hits verlieren (S-10).
#
# WICHTIG — CSP-Wildcards decken die Apex-Domain NICHT ab: `*.analytics.google.com`
# matcht `region1.analytics.google.com`, aber nicht `analytics.google.com`. Deshalb
# steht die Apex-Form jeweils zusaetzlich zum Wildcard. Wer hier eine Herkunft
# ergaenzt, muss beide Formen eintragen.
#
# Calendly wurde am 2026-08-03 vollstaendig entfernt (Terminbuchung gestrichen);
# calendly.com, *.calendly.com und assets.calendly.com sind damit aus script-src,
# style-src, frame-src und connect-src verschwunden.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; object-src 'none'; frame-src https://js.stripe.com; connect-src 'self' https://*.stripe.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
