# Netlify-Build für die LIBA-Website (Eleventy)
# Domain liegt im Root (apex) -> KEIN ELEVENTY_PATH_PREFIX setzen,
# damit .eleventy.js den Default pathPrefix "/" nutzt.
# Echte 301-Weiterleitungen kommen aus der generierten _site/_redirects
# (siehe src/_redirects.njk + src/_data/redirects.js).

[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "24"

# Sicherheits-Header (MA-3). CSP erlaubt self + die tatsächlich genutzten Dritt-Origins
# (Calendly/Stripe nur nach Klick; Google Analytics/Tag Manager, sobald echte GA4-ID gesetzt ist).
# script-src OHNE 'unsafe-inline': alle Seiten-Skripte sind ausgelagert
# (main.js, ga4-init.js). style-src behält 'unsafe-inline' für style=-Attribute
# (Hero-Hintergründe, Layout-Feinheiten) — für style-Attribute ist das risikoarm.
# connect-src enthält neben www.google-analytics.com auch *.google-analytics.com und
# *.analytics.google.com: GA4 sendet Messwerte an regionale Endpunkte (region1.…),
# die sonst geblockt würden und einzelne Hits verlieren (S-10).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://assets.calendly.com https://*.calendly.com https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; object-src 'none'; frame-src https://*.calendly.com https://js.stripe.com; connect-src 'self' https://*.calendly.com https://*.stripe.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
