# Netlify-Build für die LIBA-Website (Eleventy)
# Domain liegt im Root (apex) -> KEIN ELEVENTY_PATH_PREFIX setzen,
# damit .eleventy.js den Default pathPrefix "/" nutzt.
# Echte 301-Weiterleitungen kommen aus der generierten _site/_redirects
# (siehe src/_redirects.njk + src/_data/redirects.js).

[build]
  command = "npm run build"   # inkl. scripts/check-domain.js
  publish = "_site"
  # KEIN ignore-Kommando. Bewusst entfernt am 2026-08-13.
  #
  # Hier stand eine Regel, die Builds überspringen sollte, wenn ein Push nur
  # Markdown-Dateien ändert ("git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF …").
  # Sie hat ZWEI echte Deploys stillschweigend verschluckt — Netlify meldete
  # "Canceled build due to no content change", obwohl Commits mit CSS-, JS- und
  # Template-Änderungen anstanden. Auch eine abgesicherte Fassung mit Leer-Prüfung
  # auf $CACHED_COMMIT_REF lieferte weiter Exit 0. Der Referenzpunkt, auf den solche
  # Regeln bauen, ist auf diesem Projekt nicht verlässlich (die Builds starten
  # regelmäßig mit "Failed to fetch cache / No cached dependencies found").
  #
  # Ein nicht ausgelieferter Deploy fällt erst auf, wenn jemand die Live-Seite prüft —
  # das wiegt schwerer als die paar Build-Minuten, die die Regel gespart hätte.
  # Build-Minuten bei reinen Doku-Pushes lassen sich weiterhin sparen: "[skip ci]" in
  # die Commit-Betreffzeile schreiben. Das ist explizit und beim Commit sichtbar,
  # statt implizit und überraschend.

[build.environment]
  NODE_VERSION = "24"

# Pretty URLs AUS (Launch-Audit H-13): Netlify schrieb sonst alle internen Links auf
# endungslose Pfade um (/maschinen statt /maschinen.html) -> 301-Umwege auf DE-Seiten und
# doppelt erreichbare Seiten. Canonicals, Sitemap und Redirect-Map arbeiten mit .html.
[build.processing.html]
  pretty_urls = false

# ─── Domain & Indexierung (siehe src/_data/site.js) ───────────────────────────────
# Solange hier nichts gesetzt ist, nutzt der Build Netlifys eigene Variable URL
# (= Primary Domain des Projekts). Unter *.netlify.app ist automatisch noindex aktiv.
# Zum Launch unter der neuen Domain die Werte eintragen und committen:
#
# [context.production.environment]
#   SITE_URL = "https://<neue-domain>"          # beim späteren Umzug: https://lingener-baumaschinen.de
#   SITE_NOINDEX = "1"                           # Entscheidung E-1: bis zum Umzug nicht indexieren
#   SITE_ALIAS_HOSTS = "<alte-domain>,www.<alte-domain>"   # erst beim Umzug: 301 auf SITE_URL

# Sicherheits-Header (MA-3). CSP erlaubt self + Google Analytics/Tag Manager (GA4 lädt
# erst nach Einwilligung, siehe main.js). script-src OHNE 'unsafe-inline': alle
# Seiten-Skripte sind ausgelagert. style-src behält 'unsafe-inline' für style=-Attribute.
# connect-src enthält neben www.google-analytics.com auch *.google-analytics.com und
# *.analytics.google.com: GA4 sendet an regionale Endpunkte (S-10).
#
# WICHTIG — CSP-Wildcards decken die Apex-Domain NICHT ab: `*.analytics.google.com`
# matcht `region1.analytics.google.com`, aber nicht `analytics.google.com`. Wer hier eine
# Herkunft ergänzt, muss beide Formen eintragen.
#
# Stripe entfernt (2026-09-15, Launch-Audit N-11): wurde nirgends genutzt. Calendly wurde
# am 2026-08-03 entfernt. img-src auf self/data + GA4-Pixel eingeschränkt.
#
# HSTS bewusst OHNE includeSubDomains/preload (Launch-Audit M-1): Die Seite startet unter
# einer Übergangsdomain und zieht evtl. auf lingener-baumaschinen.de um, wo webmail/mail/
# autodiscover bei ALL-INKL kein gültiges Zertifikat haben. preload ist praktisch nicht
# rückgängig zu machen. Erst nach Subdomain-Inventur erweitern.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self'; object-src 'none'; frame-src 'none'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# Caching (Launch-Audit N-13). Schriftdateien tragen einen Hash im Namen -> dauerhaft cachebar.
# Bilder: 1 Tag frisch, danach bis 7 Tage im Hintergrund revalidiert (Dateinamen ohne Hash,
# daher bewusst kein immutable). CSS/JS bleiben beim Netlify-Standard (revalidieren).
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
